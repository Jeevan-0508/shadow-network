name: Daily tick

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: shadow-network-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun test

      - name: Record the day before ticking
        id: before
        run: |
          if [ -f data/latest.json ]; then
            echo "day=$(node -p "require('./data/latest.json').day")" >> "$GITHUB_OUTPUT"
          else
            echo "day=-1" >> "$GITHUB_OUTPUT"
          fi

      - run: bun run tick

      - name: Commit the new snapshot, only if the sim day actually advanced
        run: |
          BEFORE_DAY="${{ steps.before.outputs.day }}"
          AFTER_DAY=$(node -p "require('./data/latest.json').day")
          if [ "$AFTER_DAY" = "$BEFORE_DAY" ]; then
            echo "Still day ${AFTER_DAY} (this run's calendar day was already ticked), nothing to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/latest.json
            git commit -m "Daily tick: day ${AFTER_DAY}"
            git push
          fi
